<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AIライブ同時通訳 Pro</title>
<style>
body{font-family:-apple-system,sans-serif;margin:0;padding:15px;background:#121212;color:#fff}
.card{background:#1e1e1e;padding:18px;border-radius:16px;max-width:600px;margin:0 auto}
h2{margin-top:0;font-size:20px;text-align:center;color:#4da3ff}
label{font-size:12px;color:#aaa;display:block;margin-top:10px}
input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#2c2c2c;color:#fff;font-size:16px;box-sizing:border-box}
textarea{height:65px;font-size:14px}
button{background:#0a84ff;border:none;font-weight:bold;cursor:pointer;margin-top:12px;-webkit-appearance:none}
button.stop{background:#ff453a}
button.sub{background:#3a3a3c;font-size:13px;padding:8px;margin-top:6px}
.status{font-size:13px;color:#30d158;text-align:center;margin:10px 0;font-weight:bold;word-break:break-all;min-height:20px}
.live-box{background:#252528;padding:10px;border-radius:8px;font-size:14px;color:#ffd60a;min-height:22px;margin-bottom:8px;border:1px dashed #444}
.chat-log{background:#161616;padding:12px;border-radius:10px;height:210px;overflow-y:auto;border:1px solid #2c2c2c}
.msg{margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #2a2a2a}
.orig{font-size:13px;color:#aaa}
.trans{font-size:16px;color:#fff;font-weight:bold;margin-top:4px}
.meta{font-size:11px;color:#4da3ff;margin-top:2px}
.warn{font-size:12px;color:#ffd60a;background:rgba(255,214,10,0.1);padding:8px;border-radius:8px;margin-bottom:10px}
</style>
</head>
<body>
<div class="card">
  <h2>🎙️ AIライブ同時通訳 Pro</h2>
  <div class="warn">⚠️ <strong>イヤホン着用</strong>を推奨します。</div>
  <label>Gemini APIキー（自動保存）</label>
  <input type="password" id="apiKey" placeholder="AIzaSy... を貼り付け" oninput="save()">
  <label>通訳の方向</label>
  <select id="direction" onchange="save()">
    <option value="ja-to-en">🇯🇵 日本語 ➔ 🇺🇸 英語（スラング・ニュアンス反映）</option>
    <option value="en-to-ja">🇺🇸 英語 ➔ 🇯🇵 日本語（スラング・ニュアンス反映）</option>
  </select>
  <label>前提知識・専門用語・スラング・キャラ設定</label>
  <textarea id="contextPrompt" oninput="save()">カジュアルな日常会話・SNS・ゲーム・ビジネス現場の最新スラングや略語（ngl, fr, bet, 草, ヤバい等）のニュアンスを汲み取り、話し手のテンションに合わせた自然な口語で訳してください。</textarea>
  <button type="button" id="toggleBtn">通訳スタート（マイクON）</button>
  <button type="button" class="sub" id="clearBtn">会話の文脈（履歴）をリセット</button>
  <div class="status" id="status">待機中...</div>
  <div class="live-box" id="liveText">🗣️ ここに認識中の言葉が表示されます...</div>
  <div class="chat-log" id="chatLog"><div style="color:#666;text-align:center;font-size:13px">ここに通訳履歴が表示されます</div></div>
</div>
<script>
let rec=null,run=false,spk=false,busy=false,hist=[];
document.addEventListener("DOMContentLoaded",()=>{
  if(localStorage.getItem("g_key"))document.getElementById("apiKey").value=localStorage.getItem("g_key");
  if(localStorage.getItem("g_dir"))document.getElementById("direction").value=localStorage.getItem("g_dir");
  if(localStorage.getItem("g_ctx"))document.getElementById("contextPrompt").value=localStorage.getItem("g_ctx");
  document.getElementById("toggleBtn").addEventListener("click",toggle);
  document.getElementById("clearBtn").addEventListener("click",()=>{hist=[];document.getElementById("chatLog").innerHTML="";});
});
function save(){
  localStorage.setItem("g_key",document.getElementById("apiKey").value.trim());
  localStorage.setItem("g_dir",document.getElementById("direction").value);
  localStorage.setItem("g_ctx",document.getElementById("contextPrompt").value);
}
function toggle(){run?stop():start();}
function start(){
  const st=document.getElementById("status"),key=document.getElementById("apiKey").value.trim();
  if(!key){st.innerText="⚠️ APIキーを入力してください";return;}
  save();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){st.innerText="⚠️ Safariで開いてください";return;}
  try{if(window.speechSynthesis)window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));}catch(e){}
  run=true;busy=false;
  const btn=document.getElementById("toggleBtn");
  btn.innerText="通訳を停止する";btn.classList.add("stop");
  st.innerText="⏳ マイク起動中...";
  initRec();
}
function initRec(){
  if(!run||busy)return;
  const st=document.getElementById("status"),live=document.getElementById("liveText"),SR=window.SpeechRecognition||window.webkitSpeechRecognition,dir=document.getElementById("direction").value;
  try{
    rec=new SR();rec.lang=dir==="ja-to-en"?"ja-JP":"en-US";rec.continuous=false;rec.interimResults=true;
    rec.onstart=()=>{if(!spk&&!busy)st.innerText="🎙️ 聞き取り中... 話してください";};
    rec.onresult=async(e)=>{
      let interim="",finalTxt="";
      for(let i=e.resultIndex;i<e.results.length;i++){
        const resItem=e.results.item(i);
        const str=resItem.item(0).transcript;
        if(resItem.isFinal)finalTxt+=str;
        else interim+=str;
      }
      if(interim)live.innerText="🗣️ 聞き取り中: "+interim;
      if(finalTxt.trim()&&!busy){
        busy=true;
        try{rec.stop();}catch(err){}
        const txt=finalTxt.trim();
        live.innerText="✅ 確定: "+txt;
        st.innerText="🤖 AIが翻訳中...";
        const res=await trans(txt,dir);
        busy=false;
        if(res){
          logMsg(txt,res.translation,res.tone);
          speak(res.translation,dir==="ja-to-en"?"en-US":"ja-JP",res.rate,res.pitch);
        }
        if(run)setTimeout(initRec,300);
      }
    };
    rec.onerror=(e)=>{
      if(e.error==="not-allowed"||e.error==="service-not-allowed"){st.innerText="⚠️ マイクが許可されていません";stop();}
      else if(e.error!=="no-speech"&&e.error!=="aborted"){st.innerText="⚠️ 音声エラー: "+e.error;}
    };
    rec.onend=()=>{if(run&&!busy)setTimeout(initRec,250);};
    rec.start();
  }catch(e){st.innerText="⚠️ 起動エラー: "+e.message;stop();}
}
function stop(){
  run=false;busy=false;
  try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(e){}
  try{if(rec)rec.stop();}catch(e){}
  const btn=document.getElementById("toggleBtn");
  btn.innerText="通訳スタート（マイクON）";btn.classList.remove("stop");
  document.getElementById("status").innerText="停止中";
}
async function trans(text,dir){
  const key=document.getElementById("apiKey").value.trim(),ctx=document.getElementById("contextPrompt").value.trim(),lang=dir==="ja-to-en"?"英語":"日本語",st=document.getElementById("status");
  const hTxt=hist.slice(-6).map(h=>"発言:"+h.o+" -> 訳:"+h.t).join("\n");
  const sys="超一流の同時通訳者として以下を厳守。\n1.前提・専門用語・スラング設定:"+ctx+"\n2.直前の文脈を踏まえ、スラングや若者言葉もネイティブが同じテンションで使う自然な"+lang+"に訳す。\n3.感情やテンションから速度(rate:0.8〜1.3)と声の高さ(pitch:0.8〜1.3)を決める。\n4.必ずJSONのみ出力: {\"translation\":\"訳文\",\"tone\":\"感情説明\",\"rate\":1.0,\"pitch\":1.0}";
  const msg="【履歴】\n"+(hTxt||"なし")+"\n【今回】\n"+text;
  try{
    const r=await fetch("https://googleapis.com"+encodeURIComponent(key),{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{parts:[{text:msg}]}],generationConfig:{responseMimeType:"application/json"}})
    });
    const d=await r.json();
    if(!r.ok){st.innerText="⚠️ APIエラー: "+(d.error?d.error.message:r.status);return null;}
    const raw=d.candidates.at(0).content.parts.at(0).text;
    const p=JSON.parse(raw.replace(/[\x60]/g,"").replace(/^json/i,"").trim());
    hist.push({o:text,t:p.translation});
    return p;
  }catch(e){st.innerText="⚠️ 処理エラー: "+e.message;return null;}
}
function speak(t,l,r,p){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=Math.min(Math.max(r||1,0.7),1.4);u.pitch=Math.min(Math.max(p||1,0.7),1.4);
  u.onstart=()=>{spk=true;document.getElementById("status").innerText="🔊 翻訳音声を再生中...";};
  u.onend=()=>{spk=false;if(run)document.getElementById("status").innerText="🎙️ 聞き取り中... 話してください";};
  window.speechSynthesis.speak(u);
}
function logMsg(o,t,tn){
  const log=document.getElementById("chatLog");
  if(hist.length===1)log.innerHTML="";
  const d=document.createElement("div");d.className="msg";
  d.innerHTML='<div class="orig">🗣️ '+o+'</div><div class="trans">💬 '+t+'</div><div class="meta">🎭 '+tn+'</div>';
  log.appendChild(d);log.scrollTop=log.scrollHeight;
}
</script>
</body>
</html>
