<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AIライブ同時通訳 Pro</title>
<style>
:root{--fs:16px}
body{font-family:-apple-system,sans-serif;margin:0;padding:12px;background:#121212;color:#fff}
.card{background:#1e1e1e;padding:16px;border-radius:16px;max-width:600px;margin:0 auto}
h2{margin:0 0 8px;font-size:18px;text-align:center;color:#4da3ff}
label{font-size:12px;color:#aaa;display:block;margin-top:8px}
input,select,textarea,button{width:100%;padding:11px;margin:4px 0;border-radius:10px;border:1px solid #333;background:#2c2c2c;color:#fff;font-size:16px;box-sizing:border-box}
input[type=range]{padding:0;border:0;background:none}
textarea{height:54px;font-size:13px}
button{background:#0a84ff;border:none;font-weight:bold;margin-top:8px;-webkit-appearance:none}
button.stop{background:#ff453a}
button.sub{background:#3a3a3c;font-size:13px;padding:9px;margin-top:4px}
.row{display:flex;gap:8px}.row>div{flex:1}
details{margin-top:8px}summary{font-size:13px;color:#4da3ff;padding:6px 0}
.status{font-size:13px;color:#30d158;text-align:center;margin:8px 0;font-weight:bold;word-break:break-all;min-height:18px}
.live-box{background:#252528;padding:8px;border-radius:8px;font-size:13px;color:#ffd60a;min-height:20px;margin-bottom:6px;border:1px dashed #444}
.latest{background:#0d2a4a;padding:12px;border-radius:12px;font-size:calc(var(--fs) + 6px);font-weight:bold;min-height:48px;margin-bottom:8px;line-height:1.4}
.chat-log{background:#161616;padding:10px;border-radius:10px;height:38vh;overflow-y:auto;border:1px solid #2c2c2c}
.msg{margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #2a2a2a}
.orig{font-size:calc(var(--fs) - 3px);color:#aaa}
.trans{font-size:var(--fs);color:#fff;font-weight:bold;margin-top:3px}
.warn{font-size:12px;color:#ffd60a;background:rgba(255,214,10,.1);padding:6px;border-radius:8px}
</style>
</head>
<body>
<div class="card">
<h2>🎙️ AIライブ同時通訳 Pro</h2>
<div class="warn">⚠️ <b>イヤホン着用</b>を推奨（スピーカーだと訳音声を再認識します）</div>
<label>Gemini APIキー（自動保存）</label>
<input type="password" id="apiKey" placeholder="キーを貼り付け">
<label>通訳の方向</label>
<select id="direction">
<option value="ja-to-en">🇯🇵 日本語 ➔ 🇺🇸 英語</option>
<option value="en-to-ja">🇺🇸 英語 ➔ 🇯🇵 日本語</option>
</select>
<button type="button" id="toggleBtn">通訳スタート（マイクON）</button>
<div class="status" id="status">待機中...</div>
<div class="live-box" id="liveText">🗣️ 認識中の言葉がここに出ます</div>
<div class="latest" id="latest">最新の訳がここに大きく出ます</div>
<div class="chat-log" id="chatLog"></div>
<details>
<summary>⚙️ 設定（声・速度・表示）</summary>
<label>声の選択（訳音声）</label>
<select id="voice"></select>
<div class="row">
<div><label>基本の読み上げ速度</label><select id="rate">
<option value="0.9">ゆっくり</option><option value="1.05">標準</option><option value="1.2">速め</option><option value="1.4">かなり速い</option></select></div>
<div><label>区切り待ち時間</label><select id="stable">
<option value="500">短い(速い会話)</option><option value="800">標準</option><option value="1300">長い</option></select></div>
<div><label>文字サイズ</label><select id="fontSize">
<option value="14">小</option><option value="16">中</option><option value="20">大</option><option value="26">特大</option></select></div>
</div>
<label>コンテンツの種類</label>
<select id="scene">
<option value="vlog">Vlog・YouTubeトーク</option>
<option value="game">ゲーム実況・配信</option>
<option value="talk">ポッドキャスト・対談</option>
<option value="chat">友人同士の雑談</option>
<option value="news">ニュース・解説</option>
</select>
<label>話題・登場人物メモ（例: ○○というゲームの配信者Jack）</label>
<textarea id="contextPrompt" placeholder="誰が何について話しているか"></textarea>
<label>用語集（1行ずつ「原語=訳」）</label>
<textarea id="gloss" placeholder="GG=ナイスゲーム&#10;Jack=ジャック"></textarea>
<button type="button" class="sub" id="testBtn">🔊 翻訳テスト（「聞こえますか」）</button>
<button type="button" class="sub" id="clearBtn">履歴・文脈をリセット</button>
</details>
</div>
<script>
const MODEL="gemini-3.1-flash-lite";
const API_URL="https://generativelanguage.googleapis.com/v1beta/models/"+MODEL+":generateContent?key=";
const $=id=>document.getElementById(id);
const MAP={apiKey:"g_key",direction:"g_dir",scene:"g_scene",contextPrompt:"g_topic",gloss:"g_gloss",rate:"g_rate",fontSize:"g_fs",stable:"g_st"};
let rec=null,run=false,hist=[],chain=Promise.resolve(),queued=0,sentLen=0,latestFull="",timer=null,wake=null;
const setSt=m=>{$("status").innerText=m;};
window.onerror=m=>setSt("⚠️ JSエラー: "+m);

function load(){
  for(const id in MAP){const v=localStorage.getItem(MAP[id]);if(v!==null)$(id).value=v;}
  applyFs();
}
function save(){for(const id in MAP)localStorage.setItem(MAP[id],$(id).value);}
function applyFs(){document.documentElement.style.setProperty("--fs",$("fontSize").value+"px");}
const outLang=()=>$("direction").value==="ja-to-en"?"en-US":"ja-JP";
const inLang=()=>$("direction").value==="ja-to-en"?"ja-JP":"en-US";

function loadVoices(){
  if(!window.speechSynthesis)return;
  const L=outLang().slice(0,2),sel=$("voice");
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.replace("_","-").toLowerCase().startsWith(L));
  sel.innerHTML='<option value="">自動（おすすめ）</option>'+vs.map(v=>'<option value="'+v.name+'">'+v.name+" ("+v.lang+")</option>").join("");
  const s=localStorage.getItem("g_voice_"+L);if(s)sel.value=s;
}
function pickVoice(){
  const L=outLang().slice(0,2),vs=speechSynthesis.getVoices().filter(v=>v.lang.replace("_","-").toLowerCase().startsWith(L));
  const name=$("voice").value;
  if(name)return vs.find(v=>v.name===name);
  return vs.find(v=>/premium|enhanced|siri/i.test(v.name))||vs.find(v=>v.lang.replace("_","-")===outLang())||vs[0];
}

document.addEventListener("DOMContentLoaded",()=>{
  load();loadVoices();
  if(window.speechSynthesis)speechSynthesis.onvoiceschanged=loadVoices;
  for(const id in MAP)$(id).addEventListener("change",()=>{save();if(id==="fontSize")applyFs();if(id==="direction"){loadVoices();}});
  $("apiKey").addEventListener("input",save);$("contextPrompt").addEventListener("input",save);$("gloss").addEventListener("input",save);
  $("voice").addEventListener("change",()=>localStorage.setItem("g_voice_"+outLang().slice(0,2),$("voice").value));
  $("toggleBtn").addEventListener("click",()=>run?stop():start());
  $("clearBtn").addEventListener("click",()=>{hist=[];$("chatLog").innerHTML="";$("latest").innerText="";});
  $("testBtn").addEventListener("click",()=>{unlock();enqueue("聞こえますか",true);});
  document.addEventListener("visibilitychange",()=>{if(run&&document.visibilityState==="visible")getWake();});
});

function unlock(){try{speechSynthesis.speak(new SpeechSynthesisUtterance(""));}catch(e){}}
async function getWake(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request("screen");}catch(e){}}

function start(){
  if(!$("apiKey").value.trim()){setSt("⚠️ APIキーを入力してください");return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setSt("⚠️ Safariで開いてください");return;}
  save();unlock();getWake();
  run=true;$("toggleBtn").innerText="通訳を停止する";$("toggleBtn").classList.add("stop");
  setSt("⏳ マイク起動中...");startRec();
}
function stop(){
  run=false;clearTimeout(timer);
  try{speechSynthesis.cancel();}catch(e){}
  try{if(rec){rec.onend=null;rec.onresult=null;rec.stop();rec=null;}}catch(e){}
  try{if(wake){wake.release();wake=null;}}catch(e){}
  queued=0;
  $("toggleBtn").innerText="通訳スタート（マイクON）";$("toggleBtn").classList.remove("stop");
  setSt("停止中");
}

const INC_EN=/\b(and|but|so|because|that|which|who|to|of|the|a|an|with|or|if|when|while|like|as|for|in|on|at|my|your|i|you|we|they|is|are|was|just|really)$/i;
const INC_JA=/(が|けど|けれど|て|で|し|から|ので|を|に|は|の|と|や|って|たら|ば)$/;
function incomplete(t){
  if(/[.?!。？！]$/.test(t))return false;
  return inLang()==="ja-JP"?INC_JA.test(t):INC_EN.test(t.replace(/[,…]+$/,"").trim());
}
function flush(force){
  clearTimeout(timer);
  const t=latestFull.slice(sentLen).trim();
  if(!t)return;
  const maxLen=inLang()==="ja-JP"?40:90;
  if(force!==true&&incomplete(t)&&t.length<maxLen){timer=setTimeout(()=>flush(true),1200);return;}
  sentLen=latestFull.length;
  $("liveText").innerText="✅ 確定: "+t;enqueue(t,false);
}

function startRec(){
  if(!run)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(rec){rec.onend=null;rec.onresult=null;rec.onerror=null;}
  rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang=inLang();
  sentLen=0;latestFull="";
  const sep=inLang()==="ja-JP"?"":" ",maxLen=inLang()==="ja-JP"?40:90;
  rec.onstart=()=>setSt("🎙️ 聞き取り中... 話してください");
  rec.onresult=e=>{
    let full="";
    for(let i=0;i<e.results.length;i++)full+=(i?sep:"")+e.results[i][0].transcript;
    if(sentLen>full.length)sentLen=0;
    latestFull=full;
    const pend=full.slice(sentLen).trim();
    $("liveText").innerText="🗣️ "+pend;
    clearTimeout(timer);
    if(e.results[e.results.length-1].isFinal){flush();}
    else if(pend){const big=pend.length>maxLen;timer=setTimeout(()=>flush(big),big?200:+$("stable").value);}
  };
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){setSt("⚠️ マイクが許可されていません");stop();}
    else if(e.error!=="no-speech"&&e.error!=="aborted")setSt("⚠️ 音声エラー: "+e.error+"（自動再開します）");
  };
  rec.onend=()=>{flush(true);if(run)setTimeout(startRec,250);};
  try{rec.start();}catch(e){setTimeout(startRec,500);}
}

function enqueue(text,test){
  const dir=$("direction").value;
  const p=trans(text,dir);
  chain=chain.then(()=>p).then(t=>{
    if(!t)return;
    logMsg(text,t);speak(t);
    if(test)setSt("✅ 翻訳成功");
  });
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SCENE={game:"ゲーム実況・配信。テンション高め、ゲーム用語が多い。",vlog:"VlogやYouTubeの一人語り。カジュアル。",talk:"ポッドキャストや対談。話者が入れ替わる。",chat:"友人同士の砕けた雑談。",news:"ニュース・解説。丁寧で正確な語調。"};
const SLANG="スラング目安: ngl=正直/fr=マジで/bet=了解・いいね/no cap=ガチで/lowkey=ちょっと・内心/highkey=めっちゃ/cooked=終わった/mid=微妙/sus=怪しい/rizz=モテ力/goated=神/based=筋が通ってて最高/bruh=おいおい/deadass=マジで/slay=最高・決まってる/ate=完璧だった/W・L=勝ち・負け/salty=ふてくされ/tilted=イライラ/fire=ヤバくて良い/vibe=雰囲気/ghost=音信不通/cringe=痛い。";
async function trans(text,dir){
  const key=encodeURIComponent($("apiKey").value.replace(/\s+/g,""));
  const lang=dir==="ja-to-en"?"英語":"日本語";
  const ej=dir==="en-to-ja";
  const rules=ej
    ?"あなたは同時通訳者。英語の発話を、耳で聞いて自然な話し言葉の日本語に訳し、訳文のみ出力する。\n規則:\n1.言いよどみ(um, uh, like, you know)や言い直しは省く。\n2.長い文は短く区切り、「〜で、」「〜けど、」でつなぎ、日本語として自然な語順にする。\n3.音声認識の誤変換は文脈と用語集から補正する。\n4.入力は文の途中で切れていることがある。直前の訳の続きとして自然につなぎ、訳済みの部分は繰り返さない。\n5.スラング・略語・ネットミームは直訳せず、日本語話者が同じテンションで使う表現(ガチで、エグい、ヤバい等)に置き換える。不明なら文脈から推測する。\n6.罵倒や下品な表現も弱めすぎず、話者の強さに合わせる。\n"+SLANG
    :"You are a simultaneous interpreter. Translate the Japanese speech into natural spoken English, as a native would say it with the same energy. Output the translation only. Drop fillers, fix likely speech-recognition errors from context, split long sentences, treat input as possibly cut mid-sentence (continue naturally from the previous translation, never repeat it), and render Japanese slang with equivalent English slang.\n";
  const topic=$("contextPrompt").value.trim(),gl=$("gloss").value.trim();
  const sys=rules+"\n場面: "+(SCENE[$("scene").value]||"")+(topic?"\n話題・登場人物: "+topic:"")+(gl?"\n用語集(必ず従う):\n"+gl:"");
  const h=hist.slice(-6).map(x=>x.o+" => "+x.t).join("\n");
  const msg=(h?"【直前の文脈】\n"+h+"\n":"")+"【訳す文】\n"+text;
  const body=JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{parts:[{text:msg}]}],generationConfig:{temperature:0.3,maxOutputTokens:400}});
  for(let n=0;n<3;n++){
    try{
      const r=await fetch(API_URL+key,{method:"POST",headers:{"Content-Type":"application/json"},body:body});
      if(r.ok){
        const d=await r.json();
        const t=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||"").join("").trim();
        if(t){hist.push({o:text,t:t});if(hist.length>30)hist.shift();return t;}
        return null;
      }
      if(r.status===429||r.status>=500){setSt("⏳ 混雑中。再試行("+r.status+")");await sleep(700*(n+1));continue;}
      const tx=await r.text();setSt("⚠️ 通信エラー("+r.status+"): "+tx.slice(0,80));return null;
    }catch(err){setSt("⚠️ 通信失敗。再試行中...");await sleep(600);}
  }
  return null;
}

function speak(t){
  if(!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(t);
  u.lang=outLang();
  const v=pickVoice();if(v)u.voice=v;
  const base=+$("rate").value;
  const boost=queued>=3?1.3:queued>=2?1.15:1;
  u.rate=Math.min(Math.max(base*boost,0.6),1.8);
  queued++;
  u.onstart=()=>setSt("🔊 訳音声を再生中"+(queued>1?"（待ち"+(queued-1)+"）":""));
  const done=()=>{queued=Math.max(0,queued-1);if(run&&queued===0)setSt("🎙️ 聞き取り中... 話してください");};
  u.onend=done;u.onerror=done;
  speechSynthesis.speak(u);
}

function logMsg(o,t){
  $("latest").innerText=t;
  const log=$("chatLog"),d=document.createElement("div");d.className="msg";
  const a=document.createElement("div");a.className="orig";a.textContent="🗣️ "+o;
  const b=document.createElement("div");b.className="trans";b.textContent="💬 "+t;
  d.appendChild(a);d.appendChild(b);log.appendChild(d);
  while(log.children.length>100)log.removeChild(log.firstChild);
  log.scrollTop=log.scrollHeight;
}
</script>
</body>
</html>
