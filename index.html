<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GTA6 Live Cam Translator</title>
  <!-- PeerJS (iPhone 2台連携) -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- Tesseract.js (ブラウザ内高速OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #151922;
      --border: #283042;
      --accent: #00e5ff;
      --male: #64d2ff;
      --female: #ff7ab8;
      --unknown: #ffffff;
      --guide: #ffd60a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* 上部ステータスバー */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      gap: 6px;
    }
    .mode-switch {
      display: flex;
      background: #0b0d12;
      border-radius: 8px;
      padding: 2px;
      border: 1px solid var(--border);
    }
    .mode-switch button {
      border: none;
      background: transparent;
      color: #8e98ad;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
    }
    .mode-switch button.active {
      background: var(--accent);
      color: #000;
    }
    .status-badges {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 11px;
    }
    .badge {
      padding: 3px 6px;
      border-radius: 5px;
      background: #1f2633;
      color: #a8b3c7;
      white-space: nowrap;
    }
    .badge.ok { background: #103826; color: #4ade80; }
    .badge.warn { background: #3b2a10; color: #facc15; }

    /* カメラ＆ROIプレビュー領域 */
    .camera-wrap {
      position: relative;
      width: 100%;
      height: 36dvh;
      background: #000;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
    video#video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }
    /* 読み取り枠（ROI） */
    #roi-box {
      position: absolute;
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.58);
      pointer-events: none;
      border-radius: 6px;
    }
    #roi-label {
      position: absolute;
      top: -18px;
      left: 0;
      background: var(--accent);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
    }

    /* 字幕・ガイド表示エリア（メイン表示） */
    .display-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 12px;
      overflow-y: auto;
      gap: 8px;
    }
    .guide-box {
      background: rgba(255, 214, 10, 0.1);
      border: 1px solid rgba(255, 214, 10, 0.45);
      border-radius: 8px;
      padding: 8px 10px;
      min-height: 44px;
    }
    .guide-tag {
      font-size: 10px;
      color: var(--guide);
      font-weight: 700;
      margin-bottom: 2px;
    }
    #guide-ja {
      font-size: 15px;
      font-weight: 700;
      color: var(--guide);
      line-height: 1.35;
    }
    .sub-box {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }
    #speaker-tag {
      font-size: 11px;
      opacity: 0.85;
      margin-bottom: 4px;
      font-weight: 700;
    }
    #sub-ja {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.4;
      color: var(--unknown);
      text-shadow: 0 2px 6px rgba(0,0,0,0.85);
      word-break: keep-all;
    }
    #sub-en {
      font-size: 12px;
      color: #8e98ad;
      margin-top: 6px;
    }

    /* 下部コントロール＆設定ドロワー */
    .controls-bar {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }
    .btn {
      flex: 1;
      padding: 10px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1f2633;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .btn.primary {
      background: var(--accent);
      color: #000;
      border: none;
    }
    .btn.stop {
      background: #ef4444;
      color: #fff;
      border: none;
    }

    /* 折りたたみ設定パネル */
    #settings-drawer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 50;
      padding: 14px;
      overflow-y: auto;
    }
    #settings-drawer.open { display: block; }
    .drawer-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      max-width: 500px;
      margin: 0 auto 20px;
    }
    .drawer-card h3 {
      margin: 0 0 10px;
      font-size: 15px;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .row label { min-width: 95px; color: #cbd5e1; }
    .row input[type="range"] { flex: 1; }
    .row input[type="text"], .row input[type="password"] {
      flex: 1;
      background: #0b0d12;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 14px;
    }
    .val-num { min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

  <!-- 上部バー -->
  <header>
    <div class="mode-switch">
      <button id="btn-mode-main" class="active" onclick="setMode('main')">メイン(SE)</button>
      <button id="btn-mode-sub" onclick="setMode('sub')">サブ(8/ガイド)</button>
    </div>
    <div class="status-badges">
      <span id="badge-dict" class="badge">辞書: 読込中</span>
      <span id="badge-peer" class="badge">連携: 未接続</span>
    </div>
  </header>

  <!-- カメラ＆読み取り枠 -->
  <div class="camera-wrap" id="camera-wrap">
    <video id="video" playsinline autoplay muted></video>
    <div id="roi-box"><span id="roi-label">字幕OCR枠</span></div>
  </div>

  <!-- 翻訳結果表示 -->
  <div class="display-area">
    <div class="guide-box" id="guide-container">
      <div class="guide-tag">📍 左上ガイド・目標（サブ機連携）</div>
      <div id="guide-ja">待機中...</div>
    </div>

    <div class="sub-box">
      <div id="speaker-tag">READY</div>
      <div id="sub-ja">「開始」を押してTV画面を映してください</div>
      <div id="sub-en">---</div>
    </div>
  </div>

  <!-- 下部操作ボタン -->
  <div class="controls-bar">
    <button id="btn-toggle-scan" class="btn primary" onclick="toggleScan()">▶ 開始</button>
    <button class="btn" onclick="openSettings()">⚙️ 枠・ズーム・連携</button>
  </div>

  <!-- 設定モーダル -->
  <div id="settings-drawer">
    <div class="drawer-card">
      <h3>1. iPhone 2台連携（4桁の合言葉）</h3>
      <div class="row">
        <label>4桁コード</label>
        <input type="text" id="pair-code" maxlength="4" inputmode="numeric" placeholder="例: 7744" />
        <button class="btn primary" style="flex:0 0 80px;" onclick="connectPeer()">接続</button>
      </div>
      <div style="font-size:11px; color:#94a3b8; margin-bottom:12px;">
        ※メイン機(SE)とサブ機(8)の両方で同じ4桁の数字を入れて「接続」を押してください。
      </div>

      <h3>2. カメラズーム ＆ 読み取り枠調整</h3>
      <div class="row">
        <label>ズーム倍率</label>
        <input type="range" id="rng-zoom" min="1" max="5" step="0.1" value="1.5" oninput="updateCameraParams()" />
        <span class="val-num" id="val-zoom">1.5x</span>
      </div>
      <div class="row">
        <label>枠の左右 (X)</label>
        <input type="range" id="rng-x" min="0" max="80" step="1" value="10" oninput="updateRoiBox()" />
        <span class="val-num" id="val-x">10%</span>
      </div>
      <div class="row">
        <label>枠の上下 (Y)</label>
        <input type="range" id="rng-y" min="0" max="85" step="1" value="65" oninput="updateRoiBox()" />
        <span class="val-num" id="val-y">65%</span>
      </div>
      <div class="row">
        <label>枠の幅 (W)</label>
        <input type="range" id="rng-w" min="15" max="100" step="1" value="80" oninput="updateRoiBox()" />
        <span class="val-num" id="val-w">80%</span>
      </div>
      <div class="row">
        <label>枠の高さ (H)</label>
        <input type="range" id="rng-h" min="8" max="60" step="1" value="22" oninput="updateRoiBox()" />
        <span class="val-num" id="val-h">22%</span>
      </div>

      <h3>3. Gemini API設定（未知テキスト用）</h3>
      <div class="row">
        <label>APIキー (g_key)</label>
        <input type="password" id="api-key-input" placeholder="AIzaSy..." />
        <button class="btn" style="flex:0 0 70px;" onclick="saveApiKey()">保存</button>
      </div>
      <div class="row">
        <label>キャッシュ件数</label>
        <span id="cache-count" style="flex:1; color:#94a3b8;">0 件</span>
        <button class="btn" style="flex:0 0 90px; font-size:11px;" onclick="clearTransCache()">キャッシュ削除</button>
      </div>

      <button class="btn primary" style="width:100%; margin-top:8px;" onclick="closeSettings()">閉じる</button>
    </div>
  </div>

  <!-- OCR切り抜き用隠しCanvas -->
  <canvas id="crop-canvas" style="display:none;"></canvas>

  <script>
    // ====== 状態管理 ======
    let appMode = 'main'; // 'main' | 'sub'
    let isScanning = false;
    let videoStream = null;
    let videoTrack = null;
    let ocrWorker = null;
    let dictList = [];
    let peer = null;
    let conn = null;
    let lastOcrEn = '';
    let isProcessing = false;
    let cssScale = 1;

    // 翻訳キャッシュ（API消費節約）
    const CACHE_KEY = 'gta6_trans_cache_v1';
    let transCache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');

    // ROI・ズーム設定の保存・復元
    const ROI_KEY = 'gta6_roi_settings_v1';
    let roi = JSON.parse(localStorage.getItem(ROI_KEY) || '{"zoom":1.5,"x":10,"y":65,"w":80,"h":22}');

    // ====== 初期化 ======
    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('rng-zoom').value = roi.zoom;
      document.getElementById('rng-x').value = roi.x;
      document.getElementById('rng-y').value = roi.y;
      document.getElementById('rng-w').value = roi.w;
      document.getElementById('rng-h').value = roi.h;
      updateRoiBox();
      updateCacheCount();

      const savedKey = localStorage.getItem('g_key') || '';
      document.getElementById('api-key-input').value = savedKey;

      await loadDictionary();
    });

    async function loadDictionary() {
      const badge = document.getElementById('badge-dict');
      try {
        const res = await fetch('./gta6_dict.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        dictList = await res.json();
        badge.textContent = `辞書: ${dictList.length}件`;
        badge.className = 'badge ok';
      } catch (e) {
        badge.textContent = '辞書: なし(APIのみ)';
        badge.className = 'badge warn';
      }
    }

    // ====== モード切替（メインSE / サブ8） ======
    function setMode(mode) {
      appMode = mode;
      document.getElementById('btn-mode-main').classList.toggle('active', mode === 'main');
      document.getElementById('btn-mode-sub').classList.toggle('active', mode === 'sub');
      document.getElementById('roi-label').textContent = mode === 'main' ? '字幕OCR枠' : '左上ガイドOCR枠';

      if (mode === 'sub' && roi.y > 40) {
        roi = { zoom: roi.zoom, x: 4, y: 6, w: 55, h: 25 };
        syncSlidersFromRoi();
      } else if (mode === 'main' && roi.y < 30) {
        roi = { zoom: roi.zoom, x: 10, y: 65, w: 80, h: 22 };
        syncSlidersFromRoi();
      }
    }

    function syncSlidersFromRoi() {
      document.getElementById('rng-x').value = roi.x;
      document.getElementById('rng-y').value = roi.y;
      document.getElementById('rng-w').value = roi.w;
      document.getElementById('rng-h').value = roi.h;
      updateRoiBox();
    }

    // ====== カメラ起動・ズーム・ROI枠制御 ======
    async function initCamera() {
      if (videoStream) return;
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });
      const video = document.getElementById('video');
      video.srcObject = videoStream;
      await video.play();
      videoTrack = videoStream.getVideoTracks()[0];
      updateCameraParams();
    }

    function updateCameraParams() {
      roi.zoom = parseFloat(document.getElementById('rng-zoom').value);
      document.getElementById('val-zoom').textContent = roi.zoom.toFixed(1) + 'x';
      saveRoiSettings();

      const video = document.getElementById('video');
      cssScale = 1;
      if (videoTrack && typeof videoTrack.getCapabilities === 'function') {
        const caps = videoTrack.getCapabilities();
        if (caps.zoom) {
          const clampedZoom = Math.min(Math.max(roi.zoom, caps.zoom.min), caps.zoom.max);
          videoTrack.applyConstraints({ advanced: [{ zoom: clampedZoom }] }).catch(() => {});
          video.style.transform = 'scale(1)';
          return;
        }
      }
      cssScale = roi.zoom;
      video.style.transform = `scale(${cssScale})`;
    }

    function updateRoiBox() {
      roi.x = parseInt(document.getElementById('rng-x').value, 10);
      roi.y = parseInt(document.getElementById('rng-y').value, 10);
      roi.w = parseInt(document.getElementById('rng-w').value, 10);
      roi.h = parseInt(document.getElementById('rng-h').value, 10);

      document.getElementById('val-x').textContent = roi.x + '%';
      document.getElementById('val-y').textContent = roi.y + '%';
      document.getElementById('val-w').textContent = roi.w + '%';
      document.getElementById('val-h').textContent = roi.h + '%';

      const box = document.getElementById('roi-box');
      box.style.left = roi.x + '%';
      box.style.top = roi.y + '%';
      box.style.width = roi.w + '%';
      box.style.height = roi.h + '%';
      saveRoiSettings();
    }

    function saveRoiSettings() {
      localStorage.setItem(ROI_KEY, JSON.stringify(roi));
    }

    // ====== OCRスキャン開始・停止 ======
    async function toggleScan() {
      const btn = document.getElementById('btn-toggle-scan');
      if (isScanning) {
        isScanning = false;
        btn.textContent = '▶ 開始';
        btn.className = 'btn primary';
        return;
      }

      btn.textContent = '準備中...';
      try {
        await initCamera();
        if (!ocrWorker) {
          ocrWorker = await Tesseract.createWorker('eng');
          await ocrWorker.setParameters({
            tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK
          });
        }
        isScanning = true;
        btn.textContent = '■ 停止';
        btn.className = 'btn stop';
        scanLoop();
      } catch (err) {
        alert('カメラ起動エラー: ' + err.message);
        btn.textContent = '▶ 開始';
      }
    }

    async function scanLoop() {
      while (isScanning) {
        if (!isProcessing) {
          isProcessing = true;
          try {
            await processFrame();
          } catch (e) {
            console.error(e);
          }
          isProcessing = false;
        }
        await new Promise(r => setTimeout(r, 500));
      }
    }

    async function processFrame() {
      const video = document.getElementById('video');
      const wrap = document.getElementById('camera-wrap');
      if (video.readyState < 2) return;

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const cw = wrap.clientWidth;
      const ch = wrap.clientHeight;
      if (!vw || !vh || !cw || !ch) return;

      // object-cover で画面に表示されている実際の映像領域を計算
      const videoRatio = vw / vh;
      const wrapRatio = cw / ch;
      let dispW, dispH, dispOffX, dispOffY;
      if (videoRatio > wrapRatio) {
        dispH = vh;
        dispW = vh * wrapRatio;
        dispOffX = (vw - dispW) / 2;
        dispOffY = 0;
      } else {
        dispW = vw;
        dispH = vw / wrapRatio;
        dispOffX = 0;
        dispOffY = (vh - dispH) / 2;
      }

      // CSSズームフォールバック時の中心拡大補正
      const zW = dispW / cssScale;
      const zH = dispH / cssScale;
      const zOffX = dispOffX + (dispW - zW) / 2;
      const zOffY = dispOffY + (dispH - zH) / 2;

      const sx = zOffX + zW * (roi.x / 100);
      const sy = zOffY + zH * (roi.y / 100);
      const sw = zW * (roi.w / 100);
      const sh = zH * (roi.h / 100);

      const canvas = document.getElementById('crop-canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      canvas.width = Math.max(10, Math.floor(sw));
      canvas.height = Math.max(10, Math.floor(sh));
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

      // 明るい字幕文字を抽出しやすく二値化
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = imgData.data;
      let brightPixels = 0;
      for (let i = 0; i < d.length; i += 4) {
        const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const v = lum > 170 ? 255 : 0;
        if (v === 255) brightPixels++;
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      ctx.putImageData(imgData, 0, 0);

      // 明るい文字ピクセルが極端に少ない（字幕がない・真っ暗）場合はスキップ
      const brightRatio = brightPixels / (canvas.width * canvas.height);
      if (brightRatio < 0.008) return;

      const { data: { text } } = await ocrWorker.recognize(canvas);
      const cleaned = cleanAndFilterOcrText(text);
      if (!cleaned) return;

      if (similarity(cleaned, lastOcrEn) > 0.85) return;
      lastOcrEn = cleaned;

      if (appMode === 'sub') {
        const translated = await translateText(cleaned, true);
        renderGuide(translated.ja, cleaned);
        if (conn && conn.open) {
          conn.send({ type: 'guide', en: cleaned, ja: translated.ja });
        }
      } else {
        const result = await translateText(cleaned, false);
        if (result) renderSubtitle(result);
      }
    }

    // ゴミ文字・記号の羅列を弾くフィルター
    function cleanAndFilterOcrText(raw) {
      let s = raw
        .replace(/\n+/g, ' ')
        .replace(/[|_~`\\¥*©®™]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      // 英数字のカウント
      const alphaNumMatches = s.match(/[A-Za-z0-9]/g) || [];
      if (alphaNumMatches.length < 4) return '';

      // 記号や句読点の比率が高すぎる（ノイズだらけの）文字列を除外
      const nonWordRatio = (s.length - alphaNumMatches.length - (s.match(/ /g) || []).length) / Math.max(1, s.length);
      if (nonWordRatio > 0.35) return '';

      // 3文字以上のまともな英単語が1つもない場合はノイズとみなす
      const words = s.split(/\s+/).filter(w => /^[A-Za-z']{3,}$/.test(w.replace(/[^A-Za-z']/g, '')));
      if (words.length === 0) return '';

      return s;
    }

    // OCR文字列から話者名と本文を抽出し、前後のノイズを削る
    function extractSpeakerAndBody(rawText) {
      let speaker = '';
      let body = rawText;

      const knownSpeakers = ['Stranger', 'Jason', 'Lucia', 'Stefanie Gates', 'Stefanie', 'CO Wilson', 'CO Johnson', 'Wilson', 'Waitress', 'Customer', 'Yolanda', 'Antonia', 'Zoey', 'Shayna', 'Devin', 'Connie', 'Ronda', 'Tera', 'Isabelle', 'Penelope', 'Olivia', 'Niomi', 'Local', 'Teller', 'Manager', 'Cop', 'Prison Recording'];
      for (const sp of knownSpeakers) {
        const idx = rawText.toLowerCase().indexOf(sp.toLowerCase() + ':');
        if (idx !== -1) {
          speaker = sp;
          body = rawText.slice(idx + sp.length + 1).trim();
          break;
        }
      }

      if (!speaker) {
        const colonIdx = rawText.indexOf(':');
        if (colonIdx > 0 && colonIdx < 24) {
          const candidate = rawText.slice(0, colonIdx).replace(/[^A-Za-z ]/g, '').trim();
          if (candidate.length >= 2) {
            speaker = candidate;
            body = rawText.slice(colonIdx + 1).trim();
          }
        }
      }

      // 末尾に謎の1〜2文字ノイズや記号がくっついている場合を軽く整形
      body = body.replace(/\s+[A-Za-z]{1,2}(\s+[A-Za-z]{1,2})?\s*$/, '').trim();
      return { speaker, body };
    }

    // ====== 辞書照合 ＆ Gemini APIフォールバック ======
    async function translateText(enText, isGuideMode) {
      const { speaker: speakerPrefix, body: bodyEn } = extractSpeakerAndBody(enText);
      if (!bodyEn || bodyEn.length < 3) return null;

      // 1. 公式辞書（gta6_dict.json）からノイズ耐性つき検索（API消費ゼロ）
      if (!isGuideMode && dictList.length > 0) {
        let bestMatch = null;
        let bestScore = 0;

        for (const item of dictList) {
          let score = bestFuzzyScore(bodyEn, item.en);
          // 話者名が一致したら少し加点
          if (speakerPrefix && item.speaker && item.speaker.toLowerCase().includes(speakerPrefix.toLowerCase())) {
            score = Math.min(1, score + 0.06);
          }
          if (score > bestScore) {
            bestScore = score;
            bestMatch = item;
          }
        }

        if (bestMatch && bestScore >= 0.68) {
          return {
            ja: bestMatch.ja,
            en: bestMatch.en,
            speaker: bestMatch.speaker || speakerPrefix || 'DICT',
            color: bestMatch.color || '#ffffff',
            source: '公式辞書'
          };
        }
      }

      // 2. ブラウザローカルキャッシュ確認
      const cacheKey = (isGuideMode ? 'G:' : 'S:') + bodyEn.toLowerCase();
      if (transCache[cacheKey]) {
        return { ...transCache[cacheKey], source: 'キャッシュ' };
      }

      // 3. 無料版 Gemini API (gemini-3.1-flash-lite) へフォールバック
      const apiKey = localStorage.getItem('g_key');
      if (!apiKey) {
        return {
          ja: bodyEn,
          en: enText,
          speaker: speakerPrefix || 'API未設定',
          color: '#ffffff',
          source: '未翻訳'
        };
      }

      try {
        const prompt = isGuideMode
          ? `あなたはGTA6の公式日本語ローカライズ担当です。以下の英語の画面操作ガイド・ミッション目標を、日本のPS5版GTAらしい簡潔な命令調・UI表記の日本語に翻訳してください。翻訳文のみ出力してください。\n英語: ${bodyEn}`
          : `あなたはGTA6の公式日本語ローカライズ担当です。以下の英語字幕を自然な日本語字幕に翻訳し、話者の性別も判定してJSONのみで返してください。\n形式: {"ja":"日本語訳","gender":"m または f または u"}\n話者名ヒント: ${speakerPrefix || '不明'}\n英語: ${bodyEn}`;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${encodeURIComponent(apiKey)}`;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.2, maxOutputTokens: 150 }
          })
        });

        const data = await res.json();
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';

        let finalObj;
        if (isGuideMode) {
          finalObj = { ja: reply || bodyEn, en: enText, speaker: 'GUIDE', color: '#ffd60a' };
        } else {
          const jsonMatch = reply.match(/\{[\s\S]*\}/);
          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            const colorMap = { m: '#64d2ff', f: '#ff7ab8', u: '#ffffff' };
            finalObj = {
              ja: parsed.ja || reply,
              en: enText,
              speaker: speakerPrefix || 'AI翻訳',
              color: colorMap[parsed.gender] || '#ffffff'
            };
          } else {
            finalObj = { ja: reply || bodyEn, en: enText, speaker: speakerPrefix || 'AI翻訳', color: '#ffffff' };
          }
        }

        transCache[cacheKey] = finalObj;
        localStorage.setItem(CACHE_KEY, JSON.stringify(transCache));
        updateCacheCount();
        return { ...finalObj, source: 'Gemini API' };
      } catch (e) {
        return { ja: bodyEn, en: enText, speaker: '通信エラー', color: '#ffffff', source: 'ERR' };
      }
    }

    // 前後にOCRノイズが混ざっていても辞書文との一致度を高く出すスコア計算
    function bestFuzzyScore(ocrBody, dictEn) {
      const a = normalizeStr(ocrBody);
      const b = normalizeStr(dictEn);
      if (!a || !b) return 0;

      let score = similarity(a, b);

      // 辞書文がOCR文字列に含まれている場合（前後にノイズが付いたケース）
      if (a.includes(b)) {
        const containmentScore = b.length / a.length;
        score = Math.max(score, Math.min(0.96, 0.75 + containmentScore * 0.21));
      }

      // 単語単位の重なり（Jaccard類似度）も評価
      const wordsA = new Set(a.split(' ').filter(w => w.length >= 2));
      const wordsB = new Set(b.split(' ').filter(w => w.length >= 2));
      if (wordsA.size > 0 && wordsB.size > 0) {
        let overlap = 0;
        for (const w of wordsB) {
          if (wordsA.has(w)) overlap++;
        }
        const recall = overlap / wordsB.size;
        if (recall >= 0.7) {
          score = Math.max(score, recall * 0.9);
        }
      }

      return score;
    }

    function normalizeStr(s) {
      return s
        .toLowerCase()
        .replace(/[^a-z0-9 ]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function similarity(s1, s2) {
      const a = normalizeStr(s1);
      const b = normalizeStr(s2);
      if (!a || !b) return 0;
      if (a === b) return 1;
      const m = a.length, n = b.length;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          dp[i][j] = a[i - 1] === b[j - 1]
            ? dp[i - 1][j - 1]
            : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
        }
      }
      return 1 - dp[m][n] / Math.max(m, n);
    }

    // ====== 画面描画 ======
    function renderSubtitle(res) {
      const tag = document.getElementById('speaker-tag');
      const ja = document.getElementById('sub-ja');
      const en = document.getElementById('sub-en');
      tag.textContent = `${res.speaker} [${res.source}]`;
      tag.style.color = res.color;
      ja.textContent = res.ja;
      ja.style.color = res.color;
      en.textContent = res.en;
    }

    function renderGuide(jaText, enText) {
      document.getElementById('guide-ja').textContent = jaText;
      if (appMode === 'sub') {
        document.getElementById('sub-ja').textContent = jaText;
        document.getElementById('sub-ja').style.color = '#ffd60a';
        document.getElementById('sub-en').textContent = enText;
      }
    }

    // ====== PeerJS 4桁合言葉ペアリング ======
    function connectPeer() {
      const code = document.getElementById('pair-code').value.trim();
      if (!/^\d{4}$/.test(code)) {
        alert('4桁の数字を入力してください');
        return;
      }
      const badge = document.getElementById('badge-peer');
      badge.textContent = '連携: 接続中...';
      badge.className = 'badge warn';

      if (peer) peer.destroy();

      const mainId = `gta6-cam-main-${code}`;
      const subId = `gta6-cam-sub-${code}`;

      if (appMode === 'main') {
        peer = new Peer(mainId);
        peer.on('open', () => {
          badge.textContent = `待機中(${code})`;
        });
        peer.on('connection', (connection) => {
          conn = connection;
          badge.textContent = `連携OK(${code})`;
          badge.className = 'badge ok';
          conn.on('data', (data) => {
            if (data && data.type === 'guide') {
              renderGuide(data.ja, data.en);
            }
          });
        });
        peer.on('error', (err) => {
          badge.textContent = '連携エラー';
          console.error(err);
        });
      } else {
        peer = new Peer(subId);
        peer.on('open', () => {
          conn = peer.connect(mainId);
          conn.on('open', () => {
            badge.textContent = `送信OK(${code})`;
            badge.className = 'badge ok';
          });
          conn.on('error', () => {
            badge.textContent = '送信エラー';
          });
        });
        peer.on('error', (err) => {
          badge.textContent = '連携エラー';
          console.error(err);
        });
      }
    }

    // ====== 設定モーダル操作 ======
    function openSettings() {
      document.getElementById('settings-drawer').classList.add('open');
    }
    function closeSettings() {
      document.getElementById('settings-drawer').classList.remove('open');
    }
    function saveApiKey() {
      const val = document.getElementById('api-key-input').value.trim();
      localStorage.setItem('g_key', val);
      alert('APIキー (g_key) を保存しました');
    }
    function clearTransCache() {
      transCache = {};
      localStorage.removeItem(CACHE_KEY);
      updateCacheCount();
      alert('翻訳キャッシュを削除しました');
    }
    function updateCacheCount() {
      document.getElementById('cache-count').textContent = `${Object.keys(transCache).length} 件`;
    }
  </script>
</body>
